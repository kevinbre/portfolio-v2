<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.png" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b0e" />

    <title>Kevin Bredelis · Software Engineer</title>
    <meta
      name="description"
      content="Software Engineer especializado en React, TypeScript y Next.js. Trabajo en Membrane Labs construyendo una plataforma fintech de activos digitales, con más de 8 años creando aplicaciones web."
    />
    <meta name="author" content="Kevin Bredelis" />
    <!-- Google prefers a canonical URL even on a single-page site. -->
    <link rel="canonical" href="https://kevinbre.dev/" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook, Slack, Discord.
         Absolute URLs are required — several scrapers drop relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kevin Bredelis" />
    <meta property="og:url" content="https://kevinbre.dev/" />
    <meta property="og:title" content="Kevin Bredelis · Software Engineer" />
    <meta
      property="og:description"
      content="React, TypeScript y Next.js. Construyo interfaces rápidas y prolijas para la web."
    />
    <meta property="og:image" content="https://kevinbre.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kevin Bredelis — Software Engineer"
    />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kevin Bredelis · Software Engineer" />
    <meta
      name="twitter:description"
      content="React, TypeScript y Next.js. Construyo interfaces rápidas y prolijas para la web."
    />
    <meta name="twitter:image" content="https://kevinbre.dev/og-image.jpg" />

    <!-- Structured data: lets Google show the name and role rather than
         scraping section numbers off the page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kevin Bredelis",
        "url": "https://kevinbre.dev/",
        "image": "https://kevinbre.dev/og-image.jpg",
        "jobTitle": "Software Engineer",
        "email": "mailto:bredeliskev@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rosario",
          "addressCountry": "AR"
        },
        "worksFor": { "@type": "Organization", "name": "Membrane Labs" },
        "alumniOf": {
          "@type": "EducationalOrganization",
          "name": "Instituto Belgrano"
        },
        "knowsAbout": [
          "React",
          "TypeScript",
          "Next.js",
          "Node.js",
          "GraphQL",
          "Microfrontends"
        ],
        "sameAs": [
          "https://github.com/kevinbre",
          "https://www.linkedin.com/in/kevinbre/"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fetched without blocking the first paint: the page renders in the
         fallback face and swaps once the webfont arrives. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <!--
      Painted before the bundle arrives. This is a React app with no SSR, so
      without it the screen stays blank until the JS has downloaded and run —
      roughly a second on a mid-range phone. React replaces this on mount, and
      the styles are inline so it needs no extra request.
    -->
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          max-width: 72rem;
          margin: 0 auto;
          padding: 0 1.5rem;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        "
      >
        <p
          style="
            margin: 0 0 1.5rem;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #6e6e7a;
          "
        >
          Software Engineer
        </p>
        <h1
          style="
            margin: 0;
            font-size: clamp(2.75rem, 8vw, 4.25rem);
            line-height: 1.05;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #fff;
          "
        >
          Kevin<br />Bredelis
        </h1>
        <p
          style="
            margin: 1.5rem 0 0;
            max-width: 28rem;
            font-size: 1.125rem;
            line-height: 1.6;
            color: #a5a5b0;
          "
        >
          Construyo interfaces rápidas y prolijas para la web.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
