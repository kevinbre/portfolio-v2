<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.png" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b0e" />

    <title>Kevin Bredelis · Software Engineer</title>
    <meta
      name="description"
      content="Software Engineer especializado en React, TypeScript y Next.js. Trabajo en Membrane Labs construyendo una plataforma fintech de activos digitales, con más de 8 años creando aplicaciones web."
    />
    <meta name="author" content="Kevin Bredelis" />
    <!-- Google prefers a canonical URL even on a single-page site. -->
    <link rel="canonical" href="https://kevinbre.dev/" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook, Slack, Discord.
         Absolute URLs are required — several scrapers drop relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kevin Bredelis" />
    <meta property="og:url" content="https://kevinbre.dev/" />
    <meta property="og:title" content="Kevin Bredelis · Software Engineer" />
    <meta
      property="og:description"
      content="React, TypeScript y Next.js. Construyo interfaces rápidas y prolijas para la web."
    />
    <meta property="og:image" content="https://kevinbre.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kevin Bredelis — Software Engineer"
    />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kevin Bredelis · Software Engineer" />
    <meta
      name="twitter:description"
      content="React, TypeScript y Next.js. Construyo interfaces rápidas y prolijas para la web."
    />
    <meta name="twitter:image" content="https://kevinbre.dev/og-image.jpg" />

    <!-- Structured data: lets Google show the name and role rather than
         scraping section numbers off the page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kevin Bredelis",
        "url": "https://kevinbre.dev/",
        "image": "https://kevinbre.dev/og-image.jpg",
        "jobTitle": "Software Engineer",
        "email": "mailto:bredeliskev@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rosario",
          "addressCountry": "AR"
        },
        "worksFor": { "@type": "Organization", "name": "Membrane Labs" },
        "alumniOf": {
          "@type": "EducationalOrganization",
          "name": "Instituto Belgrano"
        },
        "knowsAbout": [
          "React",
          "TypeScript",
          "Next.js",
          "Node.js",
          "GraphQL",
          "Microfrontends"
        ],
        "sameAs": [
          "https://github.com/kevinbre",
          "https://www.linkedin.com/in/kevinbre/"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

  <body>
    <div id="root"></div>
